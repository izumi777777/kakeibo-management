<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | おうち家計簿</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #6366f1 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .brand-icon { font-size: 3rem; text-align: center; margin-bottom: .5rem; }
    .brand-title { text-align: center; font-weight: 700; font-size: 1.3rem; color: #1e293b; }
    .brand-sub { text-align: center; color: #64748b; font-size: .85rem; margin-bottom: 2rem; }
    .form-control { border-radius: 10px; padding: .7rem 1rem; }
    .btn-login {
      background: linear-gradient(135deg, #6366f1, #4338ca);
      border: none;
      border-radius: 10px;
      padding: .75rem;
      font-weight: 600;
      color: #fff;
      width: 100%;
      font-size: 1rem;
    }
    .demo-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1.5rem;
      font-size: .8rem;
      color: #64748b;
    }
    .alert { border: none; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">🏠</div>
    <div class="brand-title">おうち家計簿</div>
    <div class="brand-sub">夫婦で共有できる家計管理アプリ</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">ユーザー名</label>
        <input type="text" name="username" class="form-control" placeholder="taro" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">パスワード</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">ログイン</button>
    </form>

    <div class="demo-box">
      <strong>🧪 デモアカウント</strong><br>
      夫: <code>taro</code> / パスワード: <code>demo1234</code><br>
      妻: <code>hanako</code> / パスワード: <code>demo1234</code>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
